server:
  port: 8081

security:
  jwt:
    issuer: http://localhost:8084

spring:
  application:
    name: catalog-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/hotelbooking
    username: hotelbooking
    password: hotelbooking
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    table: flyway_schema_history_catalog
    # 3 service dùng chung schema "public" trên 1 database, mỗi service 1 bảng
    # history riêng -> service chạy sau thấy schema "public" đã có bảng (do
    # service chạy trước tạo) nhưng chưa có bảng history CỦA NÓ, nên Flyway đòi
    # baseline. baseline-version: 0 đảm bảo baseline nằm DƯỚI V1 nên V1 vẫn chạy.
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          # iam-service không phải OIDC Authorization Server đầy đủ (không có
          # /.well-known/openid-configuration) nên dùng jwk-set-uri trực tiếp,
          # không dùng issuer-uri (sẽ cố gọi discovery và fail).
          jwk-set-uri: http://localhost:8084/.well-known/jwks.json
