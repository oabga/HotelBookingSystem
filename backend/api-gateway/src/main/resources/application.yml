server:
  port: 8080

security:
  jwt:
    issuer: http://localhost:8084

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # iam-service không phải OIDC Authorization Server đầy đủ (không có
          # /.well-known/openid-configuration) nên dùng jwk-set-uri trực tiếp,
          # không dùng issuer-uri (sẽ cố gọi discovery và fail).
          jwk-set-uri: http://localhost:8084/.well-known/jwks.json
  cloud:
    gateway:
      # Theo docs/api-contract.md §6 (bản 3.0): 4 route cố định. Không có route /dev/** hay
      # /auth/**; IAM được gọi trực tiếp :8084, không qua Gateway.
      routes:
        - id: hotels
          uri: http://localhost:8081
          predicates:
            - Path=/api/hotels/**
          filters:
            - StripPrefix=1
        - id: room-types
          uri: http://localhost:8081
          predicates:
            - Path=/api/room-types/**
          filters:
            - StripPrefix=1
        - id: admin
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
        - id: bookings
          uri: http://localhost:8082
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:3001
            allowedMethods:
              - GET
              - POST
              - PUT
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: false
