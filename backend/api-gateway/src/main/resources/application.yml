server:
  port: 8080

security:
  jwt:
    issuer: http://localhost:8084

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # iam-service không phải OIDC Authorization Server đầy đủ (không có
          # /.well-known/openid-configuration) nên dùng jwk-set-uri trực tiếp,
          # không dùng issuer-uri (sẽ cố gọi discovery và fail).
          jwk-set-uri: http://localhost:8084/.well-known/jwks.json
  cloud:
    gateway:
      # 4 route theo contract bản 3.0, thêm route support và notifications. Không có route /dev/** hay
      # /auth/**; IAM được gọi trực tiếp :8084, không qua Gateway.
      routes:
        - id: hotels
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/hotels/**
          filters:
            - StripPrefix=1
        - id: room-types
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/room-types/**
          filters:
            - StripPrefix=1
        - id: admin
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
        - id: bookings
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=1
        - id: support
          uri: ${SUPPORT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/support/**
          filters:
            - StripPrefix=1
        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:3001
              - http://localhost:3002
            allowedMethods:
              - GET
              - POST
              - PUT
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: false
