server:
  port: 8084

spring:
  application:
    name: iam-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hotelbooking
    username: hotelbooking
    password: hotelbooking
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    table: flyway_schema_history_iam
    # 3 service dùng chung schema "public" trên 1 database, mỗi service 1 bảng
    # history riêng -> service chạy sau thấy schema "public" đã có bảng (do
    # service chạy trước tạo) nhưng chưa có bảng history CỦA NÓ, nên Flyway đòi
    # baseline. baseline-version: 0 đảm bảo baseline nằm DƯỚI V1 nên V1 vẫn chạy.
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

security:
  jwt:
    # Claim "iss" phát ra trong JWT nội bộ; Gateway/Catalog/Booking phải khớp đúng chuỗi này.
    issuer: http://localhost:8084
    ttl-minutes: 15

# Allowlist app -> callback frontend. "app" ngoài danh sách này bị chặn ở /auth/start (400),
# không redirect tuỳ ý (docs/api-contract.md §3.1).
sso:
  registration:
    default-tenant-id: ${IAM_REGISTRATION_DEFAULT_TENANT_ID:1}
    admin-email: ${IAM_ADMIN_EMAIL:}
  callbacks:
    app1: http://localhost:3000/callback/
    app2: http://localhost:3001/callback/
    app3: http://localhost:3002/callback/
