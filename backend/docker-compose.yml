# Local backend workflow. Default `docker compose up -d postgres` keeps the
# historical DB-only behavior. Use `--profile workflow` for the full stack.

x-workflow-profile: &workflow-profile
  profiles: [workflow]

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-db-env: &db-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotelbooking
  SPRING_DATASOURCE_USERNAME: hotelbooking
  SPRING_DATASOURCE_PASSWORD: hotelbooking

x-dev-jwt-env: &dev-jwt-env
  # Defaults are for mock-token workflow. Override both values for real IAM SSO.
  SECURITY_JWT_ISSUER: ${SECURITY_JWT_ISSUER:-http://127.0.0.1:8090}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://dev-token:8090/.well-known/jwks.json}

services:
  postgres:
    image: postgres:16
    container_name: hotelbooking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hotelbooking
      POSTGRES_PASSWORD: hotelbooking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hotelbooking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelbooking -d hotelbooking"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    <<: *workflow-profile
    image: adminer:4
    container_name: hotelbooking-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8083:8080"

  dev-token:
    <<: *workflow-profile
    image: node:22-alpine
    container_name: hotelbooking-dev-token
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      CATALOG_HOST: catalog-service
    volumes:
      - ../test-api-catalog:/app:ro
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/.well-known/jwks.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  iam-service:
    <<: *workflow-profile
    build:
      <<: *app-build
      args:
        SERVICE: iam-service
    container_name: hotelbooking-iam
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      # Placeholder credentials let IAM run its migrations and expose JWKS in
      # the local workflow. Set real values to test Google OAuth login.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-workflow-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-workflow-client-secret}
      SECURITY_JWT_ISSUER: http://localhost:8084
      IAM_REGISTRATION_DEFAULT_TENANT_ID: ${IAM_REGISTRATION_DEFAULT_TENANT_ID:-1}
      IAM_ADMIN_EMAIL: ${IAM_ADMIN_EMAIL:-diep44703@gmail.com}
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8084'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  catalog-service:
    <<: *workflow-profile
    build:
      <<: *app-build
      args:
        SERVICE: catalog-service
    container_name: hotelbooking-catalog
    restart: unless-stopped
    depends_on:
      iam-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      dev-token:
        condition: service_healthy
    environment:
      <<: [*db-env, *dev-jwt-env]
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  booking-service:
    <<: *workflow-profile
    build:
      <<: *app-build
      args:
        SERVICE: booking-service
    container_name: hotelbooking-booking
    restart: unless-stopped
    depends_on:
      catalog-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *dev-jwt-env]
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  support-service:
    <<: *workflow-profile
    build:
      <<: *app-build
      args:
        SERVICE: support-service
    container_name: hotelbooking-support
    restart: unless-stopped
    depends_on:
      booking-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *dev-jwt-env]
      BOOKING_BASE_URL: http://booking-service:8082
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  notification-service:
    <<: *workflow-profile
    build:
      <<: *app-build
      args:
        SERVICE: notification-service
    container_name: hotelbooking-notification
    restart: unless-stopped
    depends_on:
      support-service:
        condition: service_healthy
    environment:
      <<: [*db-env, *dev-jwt-env]
    ports:
      - "127.0.0.1:8086:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  api-gateway:
    <<: *workflow-profile
    build:
      <<: *app-build
      args:
        SERVICE: api-gateway
    container_name: hotelbooking-gateway
    restart: unless-stopped
    depends_on:
      catalog-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      dev-token:
        condition: service_healthy
    environment:
      <<: *dev-jwt-env
      CATALOG_SERVICE_URL: http://catalog-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      SUPPORT_SERVICE_URL: http://support-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

volumes:
  hotelbooking-pgdata:
