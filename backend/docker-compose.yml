# Mặc định chỉ có postgres:
#   docker compose up -d postgres
#
# Profile dev-test dựng đủ IAM, Catalog, Booking và dev-token để test API mà không cần cài JDK:
#   docker compose --profile dev-test up --build -d --wait
# Hướng dẫn ở README.md. JWT của profile này do dev-token ký tạm, không phải IAM thật,
# nên chỉ dùng trên máy local, không dùng để demo Google SSO.

x-resource-server-env: &resource-server-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotelbooking
  # Giá trị claim "iss" của token, phải khớp với issuer trong test-api-catalog/server.mjs.
  SECURITY_JWT_ISSUER: http://127.0.0.1:8090
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://dev-token:8090/.well-known/jwks.json

services:
  # 1 database "hotelbooking" chung cho iam-service, catalog-service, booking-service
  # (xem docs/iam-google-sso-demo-plan-v2.md §2) — POSTGRES_DB bên dưới tự tạo DB này,
  # không cần init script tạo thêm database nào khác.
  postgres:
    image: postgres:16
    container_name: hotelbooking-postgres
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hotelbooking
      POSTGRES_PASSWORD: hotelbooking
    ports:
      - "5432:5432"
    volumes:
      - hotelbooking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelbooking -d hotelbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

# Không còn service Keycloak — plan v2 dùng Google làm Identity Provider,
# iam-service (tự code) là OAuth2 Client + tự mint/verify JWT nội bộ.

volumes:
  hotelbooking-pgdata:
