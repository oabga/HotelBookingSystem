plugins {
    id 'buildlogic.java-application-conventions'
}

dependencies {
    implementation project(':common')
    implementation project(':iam-service')
    implementation project(':catalog-service')
    implementation project(':booking-service')
    implementation project(':ticketing-service')
    implementation project(':payment-service')
    implementation project(':notification-service')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
}

application {
    mainClass = 'com.hotelbooking.app.HotelBookingSystemApplication'
}
