server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # iam-service không phải OIDC Authorization Server đầy đủ (không có
          # /.well-known/openid-configuration) nên dùng jwk-set-uri trực tiếp,
          # không dùng issuer-uri (sẽ cố gọi discovery và fail).
          jwk-set-uri: http://localhost:8084/.well-known/jwks.json
  cloud:
    gateway:
      routes:
        # Theo API contract đã chốt ở docs/iam-google-sso-demo-plan-v2.md §4.2:
        # /api/rooms/** -> /rooms/** (catalog-service), /api/bookings/** -> /bookings/** (booking-service).
        # Login/callback/JWKS gọi trực tiếp iam-service :8084, không qua gateway.
        - id: catalog-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/rooms/**
          filters:
            - StripPrefix=1
        - id: booking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=1
