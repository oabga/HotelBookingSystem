services:
  postgres:
    image: postgres:16
    container_name: hotelbooking-postgres
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hotelbooking
      POSTGRES_PASSWORD: hotelbooking
    ports:
      - "5432:5432"
    volumes:
      - hotelbooking-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelbooking -d hotelbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: hotelbooking-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"

volumes:
  hotelbooking-pgdata:
