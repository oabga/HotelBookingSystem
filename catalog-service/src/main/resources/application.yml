server:
  port: 8081

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hotelbooking
    username: hotelbooking
    password: hotelbooking
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    table: flyway_schema_history_catalog
  security:
    oauth2:
      resourceserver:
        jwt:
          # iam-service is not a full OIDC Authorization Server (it has no
          # /.well-known/openid-configuration), so use its JWKS endpoint directly.
          jwk-set-uri: http://localhost:8084/.well-known/jwks.json
